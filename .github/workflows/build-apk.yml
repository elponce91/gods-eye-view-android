name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  apk:
    runs-on: ubuntu-latest

    env:
      ANDROID_COMPILE_SDK: '35'
      ANDROID_BUILD_TOOLS: '35.0.0'
      ANDROID_NDK: '27.2.12479018'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK}"

      # This repository does not currently contain Gradle Wrapper files,
      # so setup-gradle provides the pinned Gradle executable.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false
          cache-write-only: false

      - name: Restore Android build cache
        id: android-build-cache
        uses: actions/cache/restore@v4
        with:
          path: app/build
          key: ${{ runner.os }}-android-build-sdk${{ env.ANDROID_COMPILE_SDK }}-bt${{ env.ANDROID_BUILD_TOOLS }}-ndk${{ env.ANDROID_NDK }}-${{ hashFiles('gradlew', 'gradlew.bat', 'gradle/wrapper/**', 'gradle.properties', 'settings.gradle', 'settings.gradle.kts', 'build.gradle', 'build.gradle.kts', 'app/build.gradle', 'app/build.gradle.kts', '**/libs.versions.toml', '**/AndroidManifest.xml', 'app/src/**/*.kt', 'app/src/**/*.java', 'app/src/**/res/**', 'app/src/**/assets/**', 'app/src/**/jniLibs/**', 'app/src/**/cpp/**', 'app/src/**/CMakeLists.txt', '**/*.cmake') }}
          restore-keys: |
            ${{ runner.os }}-android-build-sdk${{ env.ANDROID_COMPILE_SDK }}-bt${{ env.ANDROID_BUILD_TOOLS }}-ndk${{ env.ANDROID_NDK }}-
            ${{ runner.os }}-android-build-sdk${{ env.ANDROID_COMPILE_SDK }}-bt${{ env.ANDROID_BUILD_TOOLS }}-
            ${{ runner.os }}-android-build-sdk${{ env.ANDROID_COMPILE_SDK }}-
            ${{ runner.os }}-android-build-

      - name: Report Android build cache status
        shell: bash
        env:
          CACHE_HIT: ${{ steps.android-build-cache.outputs.cache-hit }}
          PRIMARY_KEY: ${{ steps.android-build-cache.outputs.cache-primary-key }}
          MATCHED_KEY: ${{ steps.android-build-cache.outputs.cache-matched-key }}
        run: |
          echo "Compile SDK: $ANDROID_COMPILE_SDK"
          echo "Build Tools: $ANDROID_BUILD_TOOLS"
          echo "NDK: $ANDROID_NDK"
          echo "Primary key: $PRIMARY_KEY"

          if [ "$CACHE_HIT" = "true" ]; then
            echo "CACHE STATUS: EXACT HIT"
            echo "Matched key: $MATCHED_KEY"
          elif [ -n "$MATCHED_KEY" ]; then
            echo "CACHE STATUS: PARTIAL HIT"
            echo "Matched restore key: $MATCHED_KEY"
          else
            echo "CACHE STATUS: COMPLETE MISS"
          fi

      - name: Verify Android toolchain versions
        run: gradle :app:verifyCiAndroidVersions

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Save successful Android build cache
        if: ${{ success() && steps.android-build-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: app/build
          key: ${{ steps.android-build-cache.outputs.cache-primary-key }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gods-eye-view-android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
